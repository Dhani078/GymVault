name: "🐛 Bug Report"
description: "Report a reproducible defect in GymVault (Math, Logger, Payment, or UI)"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih atas laporan Anda. Mohon isi formulir di bawah ini dengan detail lengkap untuk mempermudah reproduksi bug.
  - type: input
    id: environment
    attributes:
      label: "Lingkungan Perangkat (Platform & Version)"
      description: "Contoh: Android 14 (Expo Go / APK), iOS 17 (Safari PWA), Chrome Desktop 124"
      placeholder: "e.g. Android 14 / Expo 54"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Langkah-langkah Reproduksi (Steps to Reproduce)"
      description: "Jelaskan urutan tindakan yang memicu masalah."
      placeholder: |
        1. Buka screen Logger
        2. Tambahkan latihan Barbell Bench Press
        3. Masukkan beban 100kg dan selesaikan set
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Hasil yang Diharapkan vs Hasil Aktual"
      description: "Apa yang seharusnya terjadi vs apa yang benar-benar terjadi."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Error Logs atau Tangkapan Layar"
      description: "Tempel stack trace atau lampirkan screenshot jika ada."
      render: shell
